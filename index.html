<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Glider</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #05070d;
      }
      canvas#game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud,
      #map {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #map {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
